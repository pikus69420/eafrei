# Web configuration
[web]
bind = "0.0.0.0"
port = 80
tls_port = 0
tls_cert = "/etc/eafrei/certs/cert.pem"
tls_key = "/etc/eafrei/certs/key.pem"
static_dir = "/var/www/eafrei/public"
default_page = "index.html"
cache_bytes = 8388608
cache_file_bytes = 32768
enable_htaccess = true
enable_load_balancer = false

[load_balancer]
upstreams = ["http://127.0.0.1:3000"]
timeout_secs = 30

[security]
rate_limit = 100
reload_token = ""
