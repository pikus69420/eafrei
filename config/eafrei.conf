# Syntax: TOML. Relative paths are resolved from this file, not the working directory.
[web]
bind = "127.0.0.1"
port = 8080
tls_port = 0                       # 0 disables TLS. A configured TLS listener must start successfully.
tls_cert = "../certs/cert.pem"
tls_key = "../certs/key.pem"
static_dir = "../public"
default_page = "index.html"          # also tries index.php if PHP is enabled
cache_bytes = 16777216              # max total bytes of preloaded file content (0 = no preload)
cache_file_bytes = 65536            # larger files are streamed from disk
enable_htaccess = true
enable_load_balancer = false

[php]
enabled = false
endpoint = "127.0.0.1:9000"          # or unix:/run/php/php8.4-fpm.sock
max_body_bytes = 8388608
max_concurrency = 16
timeout_secs = 30

[load_balancer]
upstreams = ["http://127.0.0.1:3000"]
timeout_secs = 30

[security]
rate_limit = 100                    # requests per client IP per 60 s; 0 = off
reload_token = ""                    # empty disables POST /admin/reload

[mail]
enabled = false                     # local SMTP inbox, not an Internet relay
bind = "127.0.0.1"
port = 2525
spool_dir = "../var/mail"
