# Web configuration
[web]
bind = "127.0.0.1"
port = 8080
tls_port = 0
tls_cert = "../certs/cert.pem"
tls_key = "../certs/key.pem"
static_dir = "../public"
default_page = "index.html"
cache_bytes = 16777216
cache_file_bytes = 65536
enable_htaccess = true
enable_load_balancer = false

[load_balancer]
upstreams = ["http://127.0.0.1:3000"]
timeout_secs = 30

[security]
rate_limit = 100
reload_token = ""
